<!DOCTYPE html>
<html lang="id" data-theme="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CueHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/iconfont/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="topbar-btn" id="btn-back" aria-label="Back">
      <i class="ti ti-arrow-left"></i>
    </button>
    <span class="topbar-title" data-lang="PLAYER_SEARCH" id="topbar-title">Pilih pemain</span>
    <div style="width:36px;"></div>
  </div>

  <!-- CONTENT -->
  <div class="app-content">

    <!-- Search box -->
    <div class="ch-card" style="padding:.6rem .75rem;display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;">
      <i class="ti ti-search" style="color:var(--color-text-muted);font-size:1rem;"></i>
      <input type="text" id="search-input"
             style="border:none;outline:none;background:none;flex:1;font-size:.875rem;color:var(--color-text);"
             data-lang-placeholder="PLAYER_SEARCH" />
    </div>

    <!-- Selected chips -->
    <div id="selected-section" class="d-none">
      <div class="section-label">
        <span data-lang="NAV_PLAYERS" style="text-transform:uppercase;"></span>
        &nbsp;·&nbsp;
        <span id="selected-count" style="color:var(--color-primary);">0</span>
        &nbsp;<span data-lang="PLAYER_SELECTED"></span>
      </div>
      <div id="selected-chips" style="margin-bottom:.5rem;"></div>
      <div class="ch-divider"></div>
    </div>

    <!-- All players list -->
    <div class="section-label" data-lang="PLAYER_ALL"></div>
    <div id="player-list">
      <div class="empty-state">
        <div class="spinner-border" style="width:1.25rem;height:1.25rem;color:var(--color-primary);"></div>
      </div>
    </div>

  </div>
  <!-- /app-content -->

  <!-- BOTTOM ACTION BAR -->
  <div style="padding:.75rem 1rem;border-top:1px solid var(--color-border);background:var(--color-surface);display:flex;gap:.5rem;">
    <button class="btn-ch-outline" style="flex:0 0 auto;width:auto;padding:.6rem .875rem;" id="btn-add-player">
      <i class="ti ti-plus"></i>
      <span data-lang="PLAYER_NEW"></span>
    </button>
    <button class="btn-ch-primary" id="btn-next" disabled>
      <span data-lang="BTN_NEXT"></span>
      <i class="ti ti-arrow-right"></i>
    </button>
  </div>

</div>
<!-- /app-shell -->

<!-- ===================== BOTTOM SHEET: ADD NEW PLAYER ===================== -->
<div class="ch-overlay d-none" id="add-player-overlay">
  <div class="ch-sheet">
    <div class="ch-sheet-handle"></div>
    <div class="ch-sheet-title" data-lang="PLAYER_NEW"></div>

    <div class="mb-3">
      <label class="form-label" style="font-size:.8rem;font-weight:500;color:var(--color-text-secondary);" data-lang="PLAYER_NAME"></label>
      <input type="text" class="form-control" id="new-player-name" />
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-size:.8rem;font-weight:500;color:var(--color-text-secondary);" data-lang="PLAYER_NICKNAME"></label>
      <input type="text" class="form-control" id="new-player-nickname" />
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-size:.8rem;font-weight:500;color:var(--color-text-secondary);" data-lang="PLAYER_PHONE"></label>
      <input type="tel" class="form-control" id="new-player-phone" />
    </div>
    <div id="add-player-error" class="ch-error d-none"></div>

    <div style="display:flex;gap:.5rem;">
      <button class="btn-ch-outline" style="flex:1;" id="btn-cancel-add-player">
        <span data-lang="CANCEL"></span>
      </button>
      <button class="btn-ch-primary" style="flex:1;" id="btn-confirm-add-player">
        <span class="btn-label" data-lang="PLAYER_SAVE"></span>
        <span class="btn-spinner spinner-border spinner-border-sm d-none"></span>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/lang.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pick-players.js"></script>
</body>
</html>
