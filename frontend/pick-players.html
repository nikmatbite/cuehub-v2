<!DOCTYPE html>
<html lang="id" data-theme="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CueHub — Pick Players</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <meta name="theme-color" content="#0f172a">
</head>
<body class="app-shell">

  <!-- Topbar -->
  <div class="topbar">
    <button class="topbar-btn" id="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="topbar-title" id="topbar-title" data-lang="PLAYER_ALL"></div>
    <button class="topbar-btn" id="btn-add-player"><i class="fa-solid fa-user-plus"></i></button>
  </div>

  <div class="app-content">
    <input class="form-control" id="search-input" type="search" data-lang-placeholder="PLAYER_SEARCH" style="margin-bottom:.75rem;">

    <!-- Selected chips -->
    <div id="selected-section" class="d-none" style="margin-bottom:.75rem;">
      <div class="section-label" style="margin-bottom:.35rem;">
        <span data-lang="PLAYER_SELECTED"></span> (<span id="selected-count">0</span>)
      </div>
      <div id="selected-chips" style="display:flex;flex-wrap:wrap;gap:.375rem;"></div>
    </div>

    <div id="player-list"></div>
  </div>

  <!-- Next button (sticky bottom) -->
  <div style="padding:.75rem;border-top:1px solid var(--color-border);">
    <button class="btn-ch-primary" id="btn-next" style="width:100%;" disabled>
      <span data-lang="BTN_NEXT"></span> <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- Add player overlay -->
  <div class="ch-overlay d-none" id="add-player-overlay">
    <div class="ch-sheet">
      <div class="ch-sheet-handle"></div>
      <div class="ch-sheet-title" data-lang="PLAYER_NEW"></div>
      <div style="display:flex;flex-direction:column;gap:.75rem;margin-top:.75rem;">
        <input class="form-control" id="new-player-name" type="text" data-lang-placeholder="PLAYER_NAME">
      </div>
      <div id="add-player-error" class="ch-error d-none" style="margin-top:.5rem;"></div>
      <div style="display:flex;gap:.5rem;margin-top:1rem;">
        <button class="btn-ch-outline" id="btn-cancel-add-player" style="flex:1;" data-lang="CANCEL"></button>
        <button class="btn-ch-primary" id="btn-confirm-add-player" style="flex:1;">
          <span class="btn-label" data-lang="PLAYER_SAVE"></span>
          <span class="btn-spinner d-none"><i class="fa-solid fa-spinner fa-spin"></i></span>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/lang.js"></script>
  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/pick-players.js"></script>
</body>
</html>
