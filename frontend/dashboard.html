<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CueHub — Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <meta name="theme-color" content="#0f172a">
</head>
<body class="app-shell">

  <!-- Topbar -->
  <div class="topbar">
    <div id="user-avatar" class="avatar avatar-sm"></div>
    <div class="topbar-title" id="user-name"></div>
    <button class="topbar-btn" id="btn-theme" title="Theme"><i class="fa-solid fa-palette"></i></button>
    <button class="topbar-btn" id="btn-logout" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>

  <!-- Tab bar -->
  <div class="ch-tab-bar">
    <button class="ch-tab active tab-btn" data-tab="sessions" data-lang="NAV_SESSION"></button>
    <button class="ch-tab tab-btn"        data-tab="players"  data-lang="NAV_PLAYERS"></button>
    <button class="ch-tab tab-btn"        data-tab="stats"    data-lang="NAV_HISTORY"></button>
  </div>

  <!-- Content -->
  <div class="app-content">

    <!-- Sessions tab -->
    <div id="tab-sessions" class="tab-panel">
      <div style="display:flex;gap:.5rem;margin-bottom:.75rem;">
        <button class="filter-btn active" data-filter="all" data-lang="FILTER_ALL"></button>
        <button class="filter-btn" data-filter="ongoing"   data-lang="SESSION_ONGOING"></button>
        <button class="filter-btn" data-filter="scheduled" data-lang="SESSION_SCHEDULED"></button>
        <button class="filter-btn" data-filter="finished"  data-lang="SESSION_FINISHED"></button>
      </div>
      <div id="session-list"></div>
      <button class="btn-ch-primary" id="btn-new-session" style="width:100%;margin-top:.75rem;">
        <i class="fa-solid fa-plus"></i> <span data-lang="NAV_SESSION"></span>
      </button>
    </div>

    <!-- Players tab -->
    <div id="tab-players" class="tab-panel d-none">
      <input class="form-control" id="player-search" type="search" data-lang-placeholder="PLAYER_SEARCH" style="margin-bottom:.75rem;">
      <div id="player-list"></div>
      <button class="btn-ch-primary" id="btn-add-player" style="width:100%;margin-top:.75rem;">
        <i class="fa-solid fa-user-plus"></i> <span data-lang="PLAYER_NEW"></span>
      </button>
    </div>

    <!-- Stats tab -->
    <div id="tab-stats" class="tab-panel d-none"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/lang.js"></script>
  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
