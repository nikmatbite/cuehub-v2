<!DOCTYPE html>
<html lang="id" data-theme="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CueHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <span class="topbar-title">CueHub</span>
    <button class="topbar-btn" id="btn-settings" aria-label="Settings">
      <i class="ti ti-settings"></i>
    </button>
  </div>

  <!-- CONTENT AREA -->
  <div class="app-content" id="app-content">

    <!-- ===================== TAB: HOME ===================== -->
    <div id="tab-home" class="tab-panel">

      <!-- Welcome card -->
      <div class="ch-card">
        <div class="stat-lbl" data-lang="DASH_WELCOME"></div>
        <div style="font-size:1rem;font-weight:600;margin-top:2px;" id="home-display-name">—</div>
      </div>

      <!-- Stat grid -->
      <div class="stat-grid" id="home-stats">
        <div class="stat-box">
          <i class="ti ti-ball-billiard" style="font-size:1.1rem;color:var(--color-primary);margin-bottom:4px;display:block;"></i>
          <div class="stat-val" id="stat-total-session">—</div>
          <div class="stat-lbl" data-lang="DASH_TOTAL_SESSION"></div>
        </div>
        <div class="stat-box">
          <i class="ti ti-trophy" style="font-size:1.1rem;color:var(--color-primary);margin-bottom:4px;display:block;"></i>
          <div class="stat-val" id="stat-win-rate">—</div>
          <div class="stat-lbl" data-lang="DASH_WIN_RATE"></div>
        </div>
        <div class="stat-box">
          <i class="ti ti-sword" style="font-size:1.1rem;color:var(--color-primary);margin-bottom:4px;display:block;"></i>
          <div class="stat-val" id="stat-total-match">—</div>
          <div class="stat-lbl" data-lang="DASH_TOTAL_MATCH"></div>
        </div>
        <div class="stat-box">
          <i class="ti ti-flame" style="font-size:1.1rem;color:var(--color-primary);margin-bottom:4px;display:block;"></i>
          <div class="stat-val" id="stat-streak">—</div>
          <div class="stat-lbl" data-lang="DASH_STREAK"></div>
        </div>
      </div>

      <!-- Last session -->
      <div class="section-label" data-lang="DASH_LAST_SESSION"></div>
      <div id="home-last-session">
        <!-- diisi oleh JS -->
      </div>

      <!-- CTA -->
      <button class="btn-ch-primary" id="btn-start-home">
        <i class="ti ti-player-play"></i>
        <span data-lang="BTN_START_PLAY"></span>
      </button>

    </div>
    <!-- /tab-home -->

    <!-- ===================== TAB: SESSION ===================== -->
    <div id="tab-session" class="tab-panel d-none">

      <!-- Active session banner -->
      <div id="session-active-banner" class="d-none">
        <div class="ch-card" style="border-color:var(--color-primary);background:var(--color-primary-soft);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.35rem;">
            <span class="section-label" style="margin:0;" data-lang="SESSION_ACTIVE"></span>
            <span class="badge-status badge-primary" id="banner-status"></span>
          </div>
          <div style="font-size:.9rem;font-weight:600;" id="banner-title">—</div>
          <div style="font-size:.75rem;color:var(--color-text-secondary);margin-top:2px;" id="banner-meta">—</div>
          <button class="btn-ch-primary mt-2" id="btn-resume-session">
            <i class="ti ti-player-play"></i>
            <span data-lang="BTN_START_PLAY"></span>
          </button>
        </div>
      </div>

      <!-- New session button -->
      <button class="btn-ch-outline mb-3" id="btn-new-session">
        <i class="ti ti-plus"></i>
        <span data-lang="BTN_START_PLAY"></span>
      </button>

      <!-- Session list -->
      <div class="section-label" data-lang="DASH_LAST_SESSION"></div>
      <div id="session-list">
        <!-- diisi oleh JS -->
      </div>

    </div>
    <!-- /tab-session -->

    <!-- ===================== TAB: PLAYERS ===================== -->
    <div id="tab-players" class="tab-panel d-none">

      <!-- Search -->
      <div class="ch-card" style="padding:.6rem .75rem;display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;">
        <i class="ti ti-search" style="color:var(--color-text-muted);font-size:1rem;"></i>
        <input type="text" id="player-search"
               style="border:none;outline:none;background:none;flex:1;font-size:.875rem;color:var(--color-text);"
               data-lang-placeholder="PLAYER_SEARCH" />
      </div>

      <!-- Player list -->
      <div id="player-list">
        <!-- diisi oleh JS -->
      </div>

    </div>
    <!-- /tab-players -->

    <!-- ===================== TAB: HISTORY ===================== -->
    <div id="tab-history" class="tab-panel d-none">

      <!-- Toggle by session / by game -->
      <ul class="nav nav-pills auth-tabs mb-3" id="history-toggle">
        <li class="nav-item flex-fill">
          <button class="nav-link active w-100" id="htab-session" data-htab="session">
            <span data-lang="HISTORY_BY_SESSION"></span>
          </button>
        </li>
        <li class="nav-item flex-fill">
          <button class="nav-link w-100" id="htab-game" data-htab="game">
            <span data-lang="HISTORY_BY_GAME"></span>
          </button>
        </li>
      </ul>

      <div id="history-list">
        <!-- diisi oleh JS -->
      </div>

    </div>
    <!-- /tab-history -->

  </div>
  <!-- /app-content -->

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-tab active" data-tab="home">
      <i class="ti ti-home"></i>
      <span data-lang="NAV_HOME"></span>
    </button>
    <button class="nav-tab" data-tab="session">
      <i class="ti ti-sport-billiard"></i>
      <span data-lang="NAV_SESSION"></span>
    </button>
    <button class="nav-tab" data-tab="players">
      <i class="ti ti-users"></i>
      <span data-lang="NAV_PLAYERS"></span>
    </button>
    <button class="nav-tab" data-tab="history">
      <i class="ti ti-history"></i>
      <span data-lang="NAV_HISTORY"></span>
    </button>
  </nav>

</div>
<!-- /app-shell -->

<!-- ===================== BOTTOM SHEET: SETTINGS ===================== -->
<div class="ch-overlay d-none" id="settings-overlay">
  <div class="ch-sheet">
    <div class="ch-sheet-handle"></div>
    <div class="ch-sheet-title" data-lang="SETTINGS_TITLE"></div>

    <!-- Language -->
    <div class="section-label" data-lang="SETTINGS_LANGUAGE"></div>
    <div style="display:flex;gap:.5rem;margin-bottom:.875rem;">
      <button class="btn-ch-outline" style="flex:1;" id="lang-id">
        <span data-lang="LANG_ID"></span>
      </button>
      <button class="btn-ch-outline" style="flex:1;" id="lang-en">
        <span data-lang="LANG_EN"></span>
      </button>
    </div>

    <!-- Theme -->
    <div class="section-label" data-lang="SETTINGS_THEME"></div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.875rem;" id="theme-btns">
      <button class="btn-ch-outline" style="flex:1;" data-theme-pick="blue"><span data-lang="THEME_BLUE"></span></button>
      <button class="btn-ch-outline" style="flex:1;" data-theme-pick="green"><span data-lang="THEME_GREEN"></span></button>
      <button class="btn-ch-outline" style="flex:1;" data-theme-pick="purple"><span data-lang="THEME_PURPLE"></span></button>
      <button class="btn-ch-outline" style="flex:1;" data-theme-pick="gold"><span data-lang="THEME_GOLD"></span></button>
    </div>

    <div class="ch-divider"></div>

    <!-- Logout -->
    <button class="btn-ch-danger" id="btn-logout">
      <i class="ti ti-logout"></i>
      <span data-lang="SETTINGS_LOGOUT"></span>
    </button>
  </div>
</div>

<!-- ===================== BOTTOM SHEET: NEW SESSION ===================== -->
<div class="ch-overlay d-none" id="new-session-overlay">
  <div class="ch-sheet">
    <div class="ch-sheet-handle"></div>
    <div class="ch-sheet-title">Sesi baru</div>

    <div class="mb-3">
      <label class="auth-form form-label" style="font-size:.8rem;font-weight:500;color:var(--color-text-secondary);">Judul sesi</label>
      <input type="text" class="form-control" id="new-session-title" placeholder="Contoh: Friday Night #25" />
    </div>
    <div class="mb-3">
      <label class="auth-form form-label" style="font-size:.8rem;font-weight:500;color:var(--color-text-secondary);">Tanggal</label>
      <input type="date" class="form-control" id="new-session-date" />
    </div>
    <div id="new-session-error" class="ch-error d-none"></div>

    <div style="display:flex;gap:.5rem;">
      <button class="btn-ch-outline" style="flex:1;" id="btn-cancel-new-session">
        <span data-lang="CANCEL"></span>
      </button>
      <button class="btn-ch-primary" style="flex:1;" id="btn-confirm-new-session">
        <span class="btn-label" data-lang="BTN_START_PLAY"></span>
        <span class="btn-spinner spinner-border spinner-border-sm d-none"></span>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/lang.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
