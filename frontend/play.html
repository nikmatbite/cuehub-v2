<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CueHub — Play</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <meta name="theme-color" content="#0f172a">
  <style>
    /* Duel arena */
    .duel-arena { display:flex; align-items:stretch; gap:.5rem; margin:.75rem 0; }
    .duel-player { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:.5rem; padding:1.25rem .75rem; border-radius:var(--radius-lg);
      cursor:pointer; transition:transform .1s; user-select:none; }
    .duel-player:active { transform:scale(.97); }
    .duel-player--a { background:var(--color-primary-soft); border:2px solid var(--color-primary); }
    .duel-player--b { background:var(--color-danger-soft);  border:2px solid var(--color-danger); }
    .duel-name { font-weight:600; font-size:.9rem; text-align:center; }
    .duel-tap  { font-size:.7rem; color:var(--color-text-muted); }
    .duel-vs   { align-self:center; font-weight:700; font-size:1.1rem; color:var(--color-text-muted); }

    /* King arena */
    .king-table { display:flex; align-items:stretch; gap:.5rem; margin:.75rem 0; }
    .king-slot { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:.5rem; padding:1.25rem .75rem; border-radius:var(--radius-lg);
      cursor:pointer; transition:transform .1s; user-select:none; }
    .king-slot:active { transform:scale(.97); }
    .king-slot--left  { background:var(--color-primary-soft); border:2px solid var(--color-primary); }
    .king-slot--right { background:var(--color-surface-2); border:2px solid var(--color-border); }
    .king-crown { font-size:1.5rem; color:#f59e0b; }
    .king-name  { font-weight:600; font-size:.9rem; text-align:center; }
    .king-vs    { align-self:center; font-weight:700; font-size:1.1rem; color:var(--color-text-muted); }
    .king-hint  { font-size:.75rem; color:var(--color-text-muted); text-align:center; margin:.25rem 0 .75rem; }

    /* Team battle arena */
    .team-arena { display:flex; align-items:stretch; gap:.5rem; margin:.75rem 0; }
    .team-side { flex:1; display:flex; flex-direction:column; align-items:center; gap:.5rem;
      padding:1rem .75rem; border-radius:var(--radius-lg);
      cursor:pointer; transition:transform .1s; user-select:none; }
    .team-side:active { transform:scale(.97); }
    .team-side--a { background:var(--color-primary-soft); border:2px solid var(--color-primary); }
    .team-side--b { background:var(--color-danger-soft);  border:2px solid var(--color-danger); }
    .team-label { font-weight:700; font-size:.8rem; letter-spacing:.05em; }
    .team-label--a { color:var(--color-primary); }
    .team-label--b { color:var(--color-danger); }
    .team-player { display:flex; align-items:center; gap:.375rem; font-size:.8rem; font-weight:500; }
    .team-tap { font-size:.7rem; color:var(--color-text-muted); margin-top:.25rem; }
    .team-vs  { align-self:center; font-weight:700; font-size:1.1rem; color:var(--color-text-muted); }

    /* Singapore */
    .sg-hint { font-size:.75rem; color:var(--color-text-muted); text-align:center; margin:.25rem 0 .75rem; }
    .sg-player-row { display:flex; align-items:center; gap:.5rem; padding:.625rem .75rem;
      background:var(--color-surface-2); border-radius:var(--radius); margin-bottom:.375rem; }
    .sg-rank  { width:1.5rem; font-weight:700; color:var(--color-primary); font-size:.875rem; }
    .sg-name  { flex:1; font-size:.875rem; font-weight:500; }
    .sg-arrows { display:flex; gap:.25rem; }

    /* Match history */
    .match-history { margin-top:1rem; padding-top:.75rem; border-top:1px solid var(--color-border); }
    .history-row { display:flex; align-items:center; gap:.5rem; padding:.375rem 0;
      border-bottom:1px solid var(--color-border); font-size:.8rem; }
    .history-no     { color:var(--color-text-muted); min-width:2rem; }
    .history-winner { color:var(--color-primary); font-weight:500; }

    /* Done state */
    .done-state i { font-size:3rem; color:#f59e0b; opacity:1 !important; }

    /* Summary */
    .summary-row { display:flex; align-items:center; gap:.5rem; padding:.5rem 0;
      border-bottom:1px solid var(--color-border); font-size:.85rem; }
    .summary-rank  { min-width:1.5rem; font-weight:700; color:var(--color-primary); }
    .summary-name  { flex:1; font-weight:500; }
    .summary-stats { font-size:.75rem; color:var(--color-text-muted); }

    /* Actions bar */
    #actions-bar { display:flex; flex-direction:column; gap:.5rem;
      padding:.75rem; border-top:1px solid var(--color-border); }
    .btn-ch-secondary { display:flex; align-items:center; justify-content:center; gap:.5rem;
      width:100%; padding:.625rem 1rem; border-radius:var(--radius);
      background:var(--color-surface-2); color:var(--color-text);
      border:1px solid var(--color-border); font-size:.875rem; cursor:pointer; }
    .btn-ch-secondary:hover { background:var(--color-surface-3); }
    .btn-end-game { color:var(--color-danger); border-color:var(--color-danger-soft); }
  </style>
</head>
<body class="app-shell">

  <!-- Topbar -->
  <div class="topbar">
    <button class="topbar-btn" id="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="topbar-title" id="page-title"></div>
  </div>

  <!-- Match area -->
  <div class="app-content" id="match-area">
    <div class="empty-state"><div class="spinner-border"></div></div>
  </div>

  <!-- Actions bar -->
  <div id="actions-bar"></div>

  <!-- Summary sheet -->
  <div class="ch-overlay d-none" id="summary-sheet">
    <div class="ch-sheet">
      <div class="ch-sheet-handle"></div>
      <div class="ch-sheet-title" data-lang="PLAY_GAME_SUMMARY"></div>
      <div id="summary-body" style="margin-top:.75rem;"></div>
      <button class="btn-ch-primary" id="btn-close-summary" style="width:100%;margin-top:1rem;" data-lang="PLAY_CLOSE"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/lang.js"></script>
  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
