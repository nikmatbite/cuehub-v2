<!DOCTYPE html>
<html lang="id" data-theme="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CueHub</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/tabler/tabler-icons@latest/tabler-icons/font/tabler-icons.css" />
  <!-- Global CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <i class="ti ti-ball-billiard"></i>
        <span class="auth-logo-text">CueHub</span>
      </div>

      <!-- Tab Login / Register -->
      <ul class="nav nav-pills auth-tabs" id="authTabs">
        <li class="nav-item flex-fill">
          <button class="nav-link active w-100" id="tab-login" data-tab="login">
            <span data-lang="AUTH_LOGIN"></span>
          </button>
        </li>
        <li class="nav-item flex-fill">
          <button class="nav-link w-100" id="tab-register" data-tab="register">
            <span data-lang="AUTH_REGISTER"></span>
          </button>
        </li>
      </ul>

      <!-- Form Login -->
      <form id="form-login" class="auth-form" novalidate>
        <div class="mb-3">
          <label class="form-label" data-lang="AUTH_EMAIL"></label>
          <input type="email" class="form-control" id="login-email" autocomplete="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label" data-lang="AUTH_PASSWORD"></label>
          <div class="input-password-wrap">
            <input type="password" class="form-control" id="login-password" autocomplete="current-password" required />
            <button type="button" class="btn-toggle-pw" data-target="login-password">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>
        <div id="login-error" class="auth-error d-none"></div>
        <button type="submit" class="btn btn-primary w-100 btn-auth" id="btn-login">
          <span class="btn-label" data-lang="AUTH_LOGIN"></span>
          <span class="btn-spinner spinner-border spinner-border-sm d-none"></span>
        </button>
      </form>

      <!-- Form Register -->
      <form id="form-register" class="auth-form d-none" novalidate>
        <div class="mb-3">
          <label class="form-label" data-lang="AUTH_DISPLAY_NAME"></label>
          <input type="text" class="form-control" id="reg-name" autocomplete="name" required />
        </div>
        <div class="mb-3">
          <label class="form-label" data-lang="AUTH_EMAIL"></label>
          <input type="email" class="form-control" id="reg-email" autocomplete="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label" data-lang="AUTH_PASSWORD"></label>
          <div class="input-password-wrap">
            <input type="password" class="form-control" id="reg-password" autocomplete="new-password" required />
            <button type="button" class="btn-toggle-pw" data-target="reg-password">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" data-lang="AUTH_TIMEZONE"></label>
          <select class="form-select" id="reg-timezone">
            <option value="Asia/Jakarta">WIB — Asia/Jakarta</option>
            <option value="Asia/Makassar">WITA — Asia/Makassar</option>
            <option value="Asia/Jayapura">WIT — Asia/Jayapura</option>
            <option value="Asia/Singapore">SGT — Asia/Singapore</option>
            <option value="UTC">UTC</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" data-lang="AUTH_LANGUAGE"></label>
          <select class="form-select" id="reg-language">
            <option value="id">Indonesia</option>
            <option value="en">English</option>
          </select>
        </div>
        <div id="reg-error" class="auth-error d-none"></div>
        <div id="reg-success" class="auth-success d-none"></div>
        <button type="submit" class="btn btn-primary w-100 btn-auth" id="btn-register">
          <span class="btn-label" data-lang="AUTH_REGISTER"></span>
          <span class="btn-spinner spinner-border spinner-border-sm d-none"></span>
        </button>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/lang.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
