<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CueHub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <meta name="theme-color" content="#0f172a">
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="auth-logo-text">CueHub</span>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="ch-tab active" id="tab-login"   data-lang="AUTH_LOGIN"></button>
        <button class="ch-tab"        id="tab-register" data-lang="AUTH_REGISTER"></button>
      </div>

      <!-- Login form -->
      <form class="auth-form" id="form-login" novalidate>
        <div>
          <label data-lang="AUTH_EMAIL"></label>
          <input class="form-control" id="login-email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label data-lang="AUTH_PASSWORD"></label>
          <div class="input-password-wrap">
            <input class="form-control" id="login-password" type="password" autocomplete="current-password" required>
            <button type="button" class="btn-toggle-pw" data-target="login-password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <div id="login-error" class="ch-error d-none"></div>
        <button type="submit" class="btn-auth btn-ch-primary" id="btn-login">
          <span class="btn-label" data-lang="AUTH_LOGIN"></span>
          <span class="btn-spinner d-none"><i class="fa-solid fa-spinner fa-spin"></i></span>
        </button>
      </form>

      <!-- Register form -->
      <form class="auth-form d-none" id="form-register" novalidate>
        <div>
          <label data-lang="AUTH_DISPLAY_NAME"></label>
          <input class="form-control" id="reg-name" type="text" autocomplete="name" required>
        </div>
        <div>
          <label data-lang="AUTH_EMAIL"></label>
          <input class="form-control" id="reg-email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label data-lang="AUTH_PASSWORD"></label>
          <div class="input-password-wrap">
            <input class="form-control" id="reg-password" type="password" autocomplete="new-password" required>
            <button type="button" class="btn-toggle-pw" data-target="reg-password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <div>
          <label data-lang="AUTH_TIMEZONE"></label>
          <select class="form-control" id="reg-timezone">
            <option value="Asia/Jakarta">WIB — Asia/Jakarta</option>
            <option value="Asia/Makassar">WITA — Asia/Makassar</option>
            <option value="Asia/Jayapura">WIT — Asia/Jayapura</option>
            <option value="Asia/Singapore">SGT — Asia/Singapore</option>
            <option value="UTC">UTC</option>
          </select>
        </div>
        <div>
          <label data-lang="AUTH_LANGUAGE"></label>
          <select class="form-control" id="reg-language">
            <option value="id">Indonesia</option>
            <option value="en">English</option>
          </select>
        </div>
        <div id="reg-error"   class="ch-error   d-none"></div>
        <div id="reg-success" class="ch-success d-none"></div>
        <button type="submit" class="btn-auth btn-ch-primary" id="btn-register">
          <span class="btn-label" data-lang="AUTH_REGISTER"></span>
          <span class="btn-spinner d-none"><i class="fa-solid fa-spinner fa-spin"></i></span>
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/lang.js"></script>
  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
