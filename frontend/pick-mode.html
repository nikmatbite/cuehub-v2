<!DOCTYPE html>
<html lang="id" data-theme="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CueHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@3.44.0/iconfont/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="topbar-btn" id="btn-back" aria-label="Back">
      <i class="ti ti-arrow-left"></i>
    </button>
    <span class="topbar-title" data-lang="MODE_SELECT"></span>
    <div style="width:36px;"></div>
  </div>

  <!-- CONTENT -->
  <div class="app-content">

    <!-- Pemain siap -->
    <div class="section-label" id="players-ready-label">
      <!-- contoh: "4 PEMAIN SIAP" — diisi JS -->
    </div>
    <div id="player-chips" style="margin-bottom:.75rem;"></div>

    <div class="ch-divider"></div>

    <!-- Mode list -->
    <div class="section-label mt-2" data-lang="MODE_SELECT"></div>
    <div id="mode-list">
      <!-- diisi oleh JS -->
    </div>

  </div>
  <!-- /app-content -->

</div>
<!-- /app-shell -->

<!-- ===================== BOTTOM SHEET: MODE INFO ===================== -->
<div class="ch-overlay d-none" id="info-overlay">
  <div class="ch-sheet">
    <div class="ch-sheet-handle"></div>
    <div style="display:flex;align-items:center;gap:.625rem;margin-bottom:.625rem;">
      <div class="mode-icon" id="info-icon">
        <i class="ti ti-info-circle"></i>
      </div>
      <div class="ch-sheet-title" id="info-title" style="margin:0;"></div>
    </div>
    <p style="font-size:.875rem;color:var(--color-text-secondary);margin-bottom:1rem;" id="info-desc"></p>
    <button class="btn-ch-primary" id="btn-start-from-info">
      <i class="ti ti-player-play"></i>
      <span data-lang="BTN_START"></span>
    </button>
  </div>
</div>

<!-- ===================== BOTTOM SHEET: TEAM BATTLE CONFIG ===================== -->
<div class="ch-overlay d-none" id="team-config-overlay">
  <div class="ch-sheet">
    <div class="ch-sheet-handle"></div>
    <div class="ch-sheet-title">Team Battle — Konfigurasi</div>

    <div class="section-label">Mode rotasi</div>
    <div style="display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem;" id="rotation-options">
      <label style="display:flex;align-items:center;gap:.625rem;cursor:pointer;padding:.5rem;border:1px solid var(--color-border);border-radius:var(--radius-sm);">
        <input type="radio" name="rotation" value="fair" style="accent-color:var(--color-primary);" checked />
        <div>
          <div style="font-size:.875rem;font-weight:500;">Fair Rotation</div>
          <div style="font-size:.75rem;color:var(--color-text-muted);">Semua kombinasi partner merata</div>
        </div>
      </label>
      <label style="display:flex;align-items:center;gap:.625rem;cursor:pointer;padding:.5rem;border:1px solid var(--color-border);border-radius:var(--radius-sm);">
        <input type="radio" name="rotation" value="random" style="accent-color:var(--color-primary);" />
        <div>
          <div style="font-size:.875rem;font-weight:500;">Random</div>
          <div style="font-size:.75rem;color:var(--color-text-muted);">Rotasi acak setiap match</div>
        </div>
      </label>
      <label style="display:flex;align-items:center;gap:.625rem;cursor:pointer;padding:.5rem;border:1px solid var(--color-border);border-radius:var(--radius-sm);">
        <input type="radio" name="rotation" value="manual" style="accent-color:var(--color-primary);" />
        <div>
          <div style="font-size:.875rem;font-weight:500;">Manual</div>
          <div style="font-size:.75rem;color:var(--color-text-muted);">Atur sendiri tiap match</div>
        </div>
      </label>
    </div>

    <div style="display:flex;gap:.5rem;">
      <button class="btn-ch-outline" style="flex:1;" id="btn-cancel-team-config">
        <span data-lang="CANCEL"></span>
      </button>
      <button class="btn-ch-primary" style="flex:1;" id="btn-confirm-team-config">
        <span class="btn-label" data-lang="BTN_START"></span>
        <span class="btn-spinner spinner-border spinner-border-sm d-none"></span>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/lang.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pick-mode.js"></script>
</body>
</html>
