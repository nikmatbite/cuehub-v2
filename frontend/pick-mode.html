<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CueHub — Pick Mode</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <meta name="theme-color" content="#0f172a">
</head>
<body class="app-shell">

  <!-- Topbar -->
  <div class="topbar">
    <button class="topbar-btn" id="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="topbar-title" data-lang="MODE_SELECT"></div>
  </div>

  <div class="app-content">
    <!-- Player chips -->
    <div class="ch-card" style="margin-bottom:.75rem;">
      <div class="section-label" id="players-ready-label"></div>
      <div id="player-chips" style="display:flex;flex-wrap:wrap;gap:.375rem;margin-top:.5rem;"></div>
    </div>

    <!-- Mode list -->
    <div id="mode-list"></div>
  </div>

  <!-- Info sheet -->
  <div class="ch-overlay d-none" id="info-overlay">
    <div class="ch-sheet">
      <div class="ch-sheet-handle"></div>
      <div style="text-align:center;font-size:2rem;margin:.5rem 0;" id="info-icon"></div>
      <div class="ch-sheet-title" id="info-title"></div>
      <div style="font-size:.875rem;color:var(--color-text-muted);margin:.5rem 0 1rem;" id="info-desc"></div>
      <button class="btn-ch-primary" id="btn-start-from-info" style="width:100%;">
        <span data-lang="BTN_START"></span>
      </button>
    </div>
  </div>

  <!-- Team Battle config sheet -->
  <div class="ch-overlay d-none" id="team-config-overlay">
    <div class="ch-sheet">
      <div class="ch-sheet-handle"></div>
      <div class="ch-sheet-title" data-lang="TEAM_CONFIG_TITLE"></div>
      <div style="display:flex;flex-direction:column;gap:.75rem;margin-top:.75rem;">
        <label class="ch-card" style="display:flex;align-items:center;gap:.75rem;cursor:pointer;">
          <input type="radio" name="rotation" value="fair" checked>
          <div>
            <div style="font-weight:500;" data-lang="ROTATION_FAIR"></div>
            <div style="font-size:.75rem;color:var(--color-text-muted);" data-lang="ROTATION_FAIR_DESC"></div>
          </div>
        </label>
        <label class="ch-card" style="display:flex;align-items:center;gap:.75rem;cursor:pointer;">
          <input type="radio" name="rotation" value="random">
          <div>
            <div style="font-weight:500;" data-lang="ROTATION_RANDOM"></div>
            <div style="font-size:.75rem;color:var(--color-text-muted);" data-lang="ROTATION_RANDOM_DESC"></div>
          </div>
        </label>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:1rem;">
        <button class="btn-ch-outline" id="btn-cancel-team-config" style="flex:1;" data-lang="CANCEL"></button>
        <button class="btn-ch-primary" id="btn-confirm-team-config" style="flex:1;">
          <span class="btn-label" data-lang="CONFIRM"></span>
          <span class="btn-spinner d-none"><i class="fa-solid fa-spinner fa-spin"></i></span>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/lang.js"></script>
  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/pick-mode.js"></script>
</body>
</html>
